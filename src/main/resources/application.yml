spring:
  application:
    name: assu
  profiles:
    group:
      "local": "local"
      "dev": "dev"
      "prod": "prod"
      "green": "green, prod"
      "blue": "blue, prod"
    active: local
  thymeleaf:
    enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
#  config:
#    import:
#      - optional:classpath:application-secret.yml
#      - optional:file:/app/config/application-secret.yml
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        show_sql: true
        highlight_sql : true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  rabbitmq:
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20
        concurrency: 1
        max-concurrency: 4
        default-requeue-rejected: false

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus" # 따옴표를 붙여 문자열임을 명시하세요.
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
