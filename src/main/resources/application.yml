spring:
  application:
    name: assu
  profiles:
    group:
      "local": "local"
      "dev": "dev"
      "prod": "prod"
      "green": "green, prod"
      "blue": "blue, prod"
    active: local
  thymeleaf:
    enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
#  config:
#    import:
#      - optional:classpath:application-secret.yml
#      - optional:file:/app/config/application-secret.yml
  jpa:
    # 요청이 끝날 때까지 DB 커넥션을 잡지 않도록 트랜잭션 밖 지연 로딩을 허용하지 않는다
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        show_sql: false
        default_batch_fetch_size: 100
        highlight_sql: false
        log_slow_query: 1000
        query:
          in_clause_parameter_padding: true
          fail_on_pagination_over_collection_fetch: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  rabbitmq:
    listener:
      simple:
        observation-enabled: true
        acknowledge-mode: manual
        prefetch: 20
        concurrency: 1
        max-concurrency: 4
        default-requeue-rejected: false

server:
  shutdown: graceful

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} [reqId=%X{requestId}] [traceId=%X{traceId:-} spanId=%X{spanId:-}] %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

management:
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  opentelemetry:
    resource-attributes:
      "[deployment.environment]": ${spring.profiles.active:local}
  endpoints:
    web:
      exposure:
        include: "health,prometheus" # 따옴표를 붙여 문자열임을 명시하세요.
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,800ms,1s,2s,5s,10s,30s
        certification.group.duration: 100ms,500ms,1s,3s,10s,30s
